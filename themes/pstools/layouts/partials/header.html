<header class="site-header">
  <div class="container">
    <nav class="navbar">
      <a href="{{ "/" | relURL }}" class="navbar-brand">
        <span class="ps-icon">PS&gt;</span>
        {{ .Site.Title }}
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="{{ "/" | relURL }}" {{ if .IsHome }}class="active"{{ end }}>Home</a></li>
        <li><a href="{{ "/modules/" | relURL }}" {{ if eq .Section "modules" }}class="active"{{ end }}>Modules</a></li>
        <li><a href="{{ "/blog/" | relURL }}" {{ if eq .Section "blog" }}class="active"{{ end }}>Blog</a></li>
      </ul>
    </nav>
  </div>
</header>
