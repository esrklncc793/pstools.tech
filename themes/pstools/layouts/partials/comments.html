{{ if and .Site.Params.giscusRepo .Site.Params.giscusRepoId .Site.Params.giscusCategoryId }}
<section class="comments-section">
  <h2 class="comments-title">Comments</h2>
  <script src="https://giscus.app/client.js"
    data-repo="{{ .Site.Params.giscusRepo }}"
    data-repo-id="{{ .Site.Params.giscusRepoId }}"
    data-category="{{ .Site.Params.giscusCategory | default "General" }}"
    data-category-id="{{ .Site.Params.giscusCategoryId }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="dark"
    data-lang="en"
    crossorigin="anonymous"
    async>
  </script>
</section>
{{ end }}
