{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-description">{{ . }}</div>{{ end }}
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="posts-list">
      {{ range .Pages }}
      <article class="post-list-item">
        <div class="post-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
          {{ range .Params.tags }}
          <span class="post-tag">{{ . }}</span>
          {{ end }}
        </div>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Summary | truncate 200 }}</p>
        <div class="post-footer">
          <a href="{{ .RelPermalink }}" class="read-more">Read more →</a>
          {{ range .Params.modules }}
          <a href="{{ "/modules/" | relURL }}{{ . | urlize }}/" class="module-ref">📦 {{ . }}</a>
          {{ end }}
        </div>
      </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
